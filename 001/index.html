<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light only">
<title>Clairvista Partners</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  /* One phone column: a full-height title card, the box's quiz, two questions, a profile card, the ship step. Plus a 16:9 booth board. */
  :root { --ink: #0b0b0c; --blue: #0047FF; --sky: #85a6ff; --muted: #5b6270; --line: #dfe2e8; --soft: #f3f5f9; color-scheme: light; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; background: #fff; color: var(--ink);
    font: 17px/1.45 Outfit, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  button, input { font: inherit; }
  button { -webkit-appearance: none; appearance: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .mono { font-family: "Space Mono", ui-monospace, Menlo, Consolas, monospace; }
  header { display: flex; align-items: center; justify-content: space-between; max-width: 460px; margin: 0 auto;
    padding: max(14px, env(safe-area-inset-top)) 20px 12px; border-bottom: 1px solid var(--line); }
  header img { height: 32px; width: auto; display: block; }
  header .tag { font-weight: 700; font-size: 11px; letter-spacing: .12em; color: var(--muted); }
  main { max-width: 460px; margin: 0 auto; padding: 16px 20px max(32px, env(safe-area-inset-bottom)); }
  .kick { font-weight: 700; font-size: 11.5px; line-height: 1.3; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin: 0 0 10px; }
  h1 { font-size: 30px; line-height: 1.12; font-weight: 800; letter-spacing: -.01em; margin: 0 0 18px; text-wrap: balance; }
  h1:focus { outline: none; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { color: var(--muted); font-size: 14.5px; line-height: 1.45; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

  /* the opening title card */
  .hero { position: relative; height: 72vh; height: calc(100svh - 178px); min-height: 360px; max-height: 720px;
    border-radius: 16px; overflow: hidden; background: #1B3FBF; cursor: pointer; margin: 0 0 14px; }
  .ed-manifest .hero { height: 60vh; height: calc(100svh - 300px); }
  .hero canvas { display: block; width: 100%; height: 100%; }
  .title { position: absolute; left: 0; right: 0; bottom: 0; padding: 80px 18px 18px; color: #fff;
    background: linear-gradient(to bottom, rgba(11,11,12,0), rgba(11,11,12,.9) 58%);
    opacity: 0; transform: translateY(10px); transition: opacity .7s ease, transform .7s ease; }
  html:not(.js) .title, .title.on { opacity: 1; transform: none; }
  .title .t1 { font-size: 31px; font-weight: 800; line-height: 1.07; letter-spacing: -.01em; margin: 0 0 6px; text-wrap: balance; }
  .title .t2 { color: var(--sky); font-weight: 700; font-size: 18px; margin: 0; transition: opacity .6s ease .35s; }
  .title:not(.on) .t2 { opacity: 0; }
  html:not(.js) .title .t2 { opacity: 1; }
  .skip { position: absolute; top: 11px; right: 12px; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: rgba(255,255,255,.72); }
  .promise { font-size: 20px; font-weight: 700; line-height: 1.3; margin: 0 0 6px; text-wrap: balance; }

  .go { display: block; width: 100%; font-weight: 700; font-size: 18px; color: #fff; background: var(--ink);
    border: 0; border-radius: 14px; padding: 15px; margin-top: 12px; cursor: pointer; }
  .go:disabled { background: #c9ced8; cursor: default; }
  .ghost { background: none; color: var(--ink); border: 1.5px solid var(--line); font-weight: 600; font-size: 16px; padding: 12px; }

  /* the box quiz */
  .opts { display: grid; gap: 10px; }
  .opt { display: block; width: 100%; text-align: left; color: inherit; background: #fff;
    border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; cursor: pointer; }
  .opt b { font-weight: 700; margin-right: 6px; }
  .opt.picked { border-color: var(--ink); }
  .opt.right { border-color: var(--blue); background: #eef3ff; }
  .opt:disabled { cursor: default; color: inherit; }
  .opt:disabled:not(.picked):not(.right) { opacity: .45; }
  #reveal { margin-top: 18px; }
  .verdict { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  .forty { border-radius: 14px; padding: 12px; margin: 14px 0; background: #2450D8; }
  .cells { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .cells i { aspect-ratio: 1; border-radius: 4px; background: #FFF6E2; transform: scale(0); }
  .cells i:first-child { background: #E3A21A; transform: none; }
  .forty.on .cells i { animation: cell .35s cubic-bezier(.2,1.4,.4,1) forwards; animation-delay: calc(var(--i) * 28ms + 150ms); }
  @keyframes cell { to { transform: scale(1); } }
  .forty .lab { display: flex; justify-content: space-between; gap: 8px; margin-top: 9px; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: rgba(255,255,255,.85); }

  /* which half */
  .halfs { display: grid; gap: 12px; }
  .half { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; color: inherit; background: #fff;
    border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; cursor: pointer; }
  .half svg { flex: none; width: 54px; height: 54px; }
  .half b { display: block; font-size: 24px; font-weight: 800; line-height: 1.15; }
  .half small { display: block; color: var(--muted); font-size: 16px; margin-top: 2px; }
  .half:active { border-color: var(--blue); background: #eef3ff; }

  /* chips */
  .grp { margin: 0 0 18px; }
  .grp h2 { font-weight: 700; font-size: 11.5px; letter-spacing: .12em; color: var(--muted); margin: 0 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-size: 15.5px; border: 1.5px solid var(--line); background: #fff; border-radius: 999px;
    padding: 8px 14px; color: inherit; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }

  /* the profile card */
  .card { border-radius: 18px; background: var(--ink); color: #fff; padding: 18px 18px 14px; margin: 0 0 16px; }
  .card .top { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 11px; letter-spacing: .12em; color: #9aa4b5; }
  .card .top b { color: #fff; background: var(--blue); border-radius: 999px; padding: 2px 8px; font-weight: 700; }
  .card .side { font-size: 25px; font-weight: 800; line-height: 1.12; margin: 12px 0 14px; }
  .card .side em { font-style: normal; color: var(--sky); }
  .card dl { display: grid; grid-template-columns: auto 1fr; gap: 9px 16px; margin: 0; border-top: 1px solid #2a303c; padding-top: 12px; }
  .card dt { font-weight: 700; font-size: 10.5px; letter-spacing: .12em; color: #9aa4b5; padding-top: 5px; white-space: nowrap; }
  .card dd { margin: 0; font-size: 18px; font-weight: 600; min-width: 0; }
  .card dd.look { color: var(--sky); }
  .card .foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; font-size: 10px; letter-spacing: .1em; color: #9aa4b5; }

  .switch { display: flex; gap: 12px; align-items: flex-start; margin: 0 0 20px; cursor: pointer; position: relative; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .track { flex: none; width: 48px; height: 28px; border-radius: 999px; background: #c9ced8; position: relative; transition: background .2s; margin-top: 1px; }
  .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff;
    transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .switch input:checked + .track { background: var(--blue); }
  .switch input:checked + .track::after { transform: translateX(20px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--blue); outline-offset: 3px; }
  .lbl { font-weight: 600; line-height: 1.3; }
  .lbl small { display: block; color: var(--muted); font-weight: 400; font-size: 14.5px; margin-top: 2px; }

  .match { background: var(--soft); border-radius: 16px; padding: 16px; margin: 0 0 6px; }
  .mhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .mhead .kick { margin: 0; }
  .sample { font-size: 10px; letter-spacing: .12em; font-weight: 700; color: var(--muted); border: 1px solid var(--line); background: #fff;
    border-radius: 999px; padding: 3px 8px; }
  .mline { font-size: 18px; font-weight: 700; line-height: 1.3; margin: 10px 0 16px; text-wrap: balance; }
  .pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 12px; }
  .mini { background: var(--ink); color: #fff; border-radius: 12px; padding: 12px 11px 10px; position: relative; min-width: 0; }
  .mini .k { font-size: 9.5px; letter-spacing: .12em; color: #9aa4b5; font-weight: 700; }
  .mini .n { font-weight: 700; font-size: 15px; line-height: 1.2; margin: 4px 0 3px; }
  .mini .d { font-size: 13px; color: #c9d1de; line-height: 1.3; }
  .mt { position: absolute; top: -9px; right: 8px; background: var(--blue); color: #fff; font-size: 9.5px; letter-spacing: .12em;
    font-weight: 700; border-radius: 999px; padding: 3px 7px; }
  .match .ghost { background: #fff; margin-top: 4px; }

  /* shipping: the live form (Manifest) and the preview (No. 001) */
  .f { display: block; margin: 0 0 12px; min-width: 0; }
  .f > span { display: block; font-weight: 700; font-size: 11px; letter-spacing: .12em; color: var(--muted); margin: 0 0 6px; text-transform: uppercase; }
  .f input { width: 100%; font-size: 17px; padding: 12px 13px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff;
    color: var(--ink); -webkit-appearance: none; appearance: none; }
  .f input:focus { outline: none; border-color: var(--blue); }
  .row3 { display: grid; grid-template-columns: 1.5fr .8fr 1fr; gap: 8px; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin: 16px 0 8px; font-weight: 600; line-height: 1.35; cursor: pointer; }
  .check input { width: 22px; height: 22px; accent-color: var(--blue); flex: none; margin: 0; }
  .formprev { border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; margin: 4px 0 8px; background: var(--soft); }
  .formprev .fake { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; color: #9aa1ad; font-size: 15.5px; margin: 0 0 8px; }
  .formprev .box { display: flex; gap: 10px; align-items: flex-start; background: #fff; border: 2px solid var(--blue); border-radius: 12px;
    padding: 12px; margin-top: 12px; font-weight: 700; line-height: 1.3; }
  .formprev .box i { flex: none; width: 22px; height: 22px; border-radius: 6px; background: var(--blue); position: relative; }
  .formprev .box i::after { content: ""; position: absolute; left: 7px; top: 3px; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }

  .line { font-size: 26px; line-height: 1.15; font-weight: 800; margin: 24px 0 4px; padding-top: 20px; border-top: 1px solid var(--line); text-wrap: balance; }
  .by { color: var(--blue); font-weight: 700; font-size: 18px; margin-bottom: 14px; }
  .sign { color: var(--muted); font-size: 15.5px; line-height: 1.55; margin: 20px 0 16px; }
  .sign a { color: var(--ink); text-underline-offset: 3px; }
  .big { font-size: 20px; font-weight: 700; line-height: 1.3; }

  /* booth board, 16:9 */
  body.boardmode { background: #e3e8f0; }
  #boardBar { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 760px; margin: 0 auto;
    padding: max(12px, env(safe-area-inset-top)) 16px 12px; font-size: 14px; color: var(--muted); }
  #boardBar button { font-weight: 700; font-size: 15px; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  #boardWrap { margin: 0 auto; overflow: hidden; }
  .board { width: 1600px; height: 900px; transform-origin: 0 0; background: #f4f6fa; display: grid; grid-template-rows: auto 1fr auto;
    padding: 38px 56px 26px; }
  .bTop { display: flex; align-items: center; gap: 44px; border-bottom: 2px solid var(--line); padding-bottom: 22px; }
  .bTop img { height: 58px; width: auto; display: block; }
  .bTop .bLine { font-size: 46px; font-weight: 800; letter-spacing: -.01em; margin: 0; flex: 1; }
  .bTop .bBy { font-size: 26px; font-weight: 700; color: var(--blue); margin: 0; }
  .bGrid { display: grid; grid-template-columns: 1fr 560px 1fr; gap: 34px; padding-top: 26px; min-height: 0; }
  .col { min-height: 0; overflow: hidden; }
  .col h2 { font-size: 17px; letter-spacing: .14em; color: var(--muted); margin: 0 0 14px; display: flex; justify-content: space-between; }
  .col h2 i { font-style: normal; color: var(--ink); }
  .stack { display: grid; gap: 12px; }
  .bc { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 13px 18px; display: grid; grid-template-columns: 1fr auto; gap: 1px 12px; }
  .bc .n { font-size: 21px; font-weight: 700; }
  .bc .c { font-size: 21px; font-weight: 800; text-align: right; }
  .bc .d { font-size: 16.5px; color: var(--muted); grid-column: 1 / -1; }
  .bc.new { animation: arrive .8s ease-out; border-color: var(--blue); }
  @keyframes arrive { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: none; } }
  .center { background: var(--ink); color: #fff; border-radius: 24px; padding: 28px 30px; display: flex; flex-direction: column; }
  .center .kick { color: var(--sky); font-size: 15px; }
  .center .city { font-size: 64px; font-weight: 800; line-height: 1; margin: 10px 0 0; }
  .pairbig { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin: 26px 0; }
  .bigc { background: #181b22; border: 1.5px solid #2a303c; border-radius: 16px; padding: 16px; }
  .bigc .k { font-size: 12px; letter-spacing: .12em; color: #9aa4b5; font-weight: 700; }
  .bigc .n { font-size: 22px; font-weight: 700; margin: 6px 0 4px; line-height: 1.15; }
  .bigc .d { font-size: 16px; color: #c9d1de; line-height: 1.35; }
  .mpill { background: var(--blue); color: #fff; border-radius: 999px; padding: 8px 12px; font-size: 13px; letter-spacing: .12em; font-weight: 700; }
  .center .why { font-size: 20px; color: #c9d1de; margin: auto 0 0; }
  .bFoot { display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; letter-spacing: .14em; color: var(--muted); padding-top: 16px; }
  .bFoot .cta { color: var(--ink); }
  @media (prefers-reduced-motion: reduce) {
    .bc.new, .forty.on .cells i { animation: none; } .cells i { transform: none; }
    .title, .title .t2 { transition: none; }
  }

  /* round 2: copy deck */
  .ed-manifest .hero { height: 64vh; height: calc(100svh - 250px); }
  .card .lookline { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid #2a303c; color: var(--sky); font-size: 17px; font-weight: 600; line-height: 1.35; }
  .formprev .fakes3 { display: grid; grid-template-columns: 1.5fr .8fr 1fr; gap: 8px; }
  .sign .note { color: var(--ink); font-size: 17.5px; font-weight: 600; line-height: 1.45; display: inline-block; margin-bottom: 8px; }
  .endmark { width: 56px; height: 5px; background: var(--blue); border-radius: 3px; margin: 18px 0 18px; }
  h1.endline { font-size: 34px; line-height: 1.08; margin: 0 0 6px; }
  .mpill { text-transform: uppercase; }
  .col h2 { font-size: 28px; font-weight: 800; letter-spacing: -.01em; color: var(--ink); align-items: baseline; }
  .col h2 i { font-size: 17px; font-weight: 700; color: var(--muted); letter-spacing: .1em; }
  .bFoot { font-size: 20px; font-weight: 600; letter-spacing: 0; }
  .bFoot .bBy { color: var(--blue); font-weight: 700; }
  .center .city { font-size: 96px; margin-top: 18px; }
  .pairbig { margin: auto 0; gap: 16px; }
  .bigc { padding: 22px; }
  .bigc .n { font-size: 30px; margin: 10px 0 8px; }
  .bigc .d { font-size: 20px; }
  .mpill { font-size: 15px; padding: 10px 14px; }

  /* round 3: designer pass */
  .bEx { font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 14px; background: #fff; }
  .pairbig { grid-template-columns: 1fr; justify-items: stretch; gap: 14px; margin: auto 0; }
  .mpill { justify-self: center; }
  .bigc { padding: 22px 24px; }
  .bigc .n { font-size: 32px; line-height: 1.12; text-wrap: balance; }
  .bigc .d { font-size: 22px; }
  .center .why { font-size: 24px; color: #fff; }
  .mini { padding: 14px 12px 12px; }
  .mini .n { text-wrap: balance; }
  .mini .d { text-wrap: balance; font-size: 13.5px; line-height: 1.3; }
  .kick { font-size: 12.5px; }
  .grp h2 { font-size: 12px; }
  .card dt { font-size: 11.5px; padding-top: 4px; }
  .card .top { font-size: 12px; }
  .card .foot { font-size: 11px; }
  .mini .k { font-size: 10.5px; }
  .mt { font-size: 10.5px; }
  .forty .lab { font-size: 11px; color: #fff; }
  header .tag { font-size: 12px; color: var(--ink); }
  .title { padding: 130px 18px 20px; background: linear-gradient(to bottom, rgba(11,11,12,0), rgba(11,11,12,.88) 42%, rgba(11,11,12,.96)); }
  .title .t1 { font-size: 34px; line-height: 1.04; text-shadow: 0 1px 14px rgba(11,11,12,.5); }
  .title .t2 { font-size: 19px; }
  .chips { gap: 10px; }
  .chip { padding: 11px 16px; min-height: 44px; font-size: 16px; }
  .chip[aria-pressed="true"] { box-shadow: 0 0 0 3px rgba(0,71,255,.18); }
  .half { min-height: 88px; }
  .opt { min-height: 56px; }
  .forty { background: var(--blue); padding: 14px; }
  .cells { gap: 5px; }
  .card .side { font-size: 28px; margin: 14px 0 16px; }
  .card dd { font-size: 19px; }
  .card { padding: 20px 20px 16px; box-shadow: 0 18px 40px -22px rgba(0,71,255,.55); }
  .match { background: #fff; border: 1.5px solid var(--line); }
  .mline { font-size: 19px; }
  .bc .n, .bc .c { font-size: 23px; }
  .bc .d { font-size: 18.5px; }
  .bc { padding: 14px 20px; }
  .bFoot { font-size: 24px; }
  .bFoot .cta { font-weight: 700; }
  .bTop .bLine { font-size: 52px; }
  .card .side { font-size: 26px; text-wrap: balance; }
  .bc .n, .bc .c { font-size: 21px; }
  .center .city { font-size: 84px; }
  .bigc { padding: 18px 22px; }
  .bigc .n { font-size: 28px; margin: 6px 0 6px; }
  .bigc .d { font-size: 20px; }
  .pairbig { gap: 10px; margin: 18px 0; }
  .center .why { font-size: 21px; margin-top: auto; }
  .contact { display: grid; gap: 6px; margin: -4px 0 14px; }
  .contact .cline { color: var(--ink); font-size: 17px; font-weight: 600; text-underline-offset: 3px; justify-self: start; padding: 4px 0; }
  .contact .save { display: block; text-align: center; text-decoration: none; margin-top: 10px; }
</style>
</head>

  on('#seeBoard', 'click', () => openBoard(true));
  on('#boardBack', 'click', closeBoard);
  addEventListener('resize', () => { if (!boardWrap.hidden) fitBoard(); });

  // hooks for the review preview bar
  window.cvp = {
    box: key => { if (!boardWrap.hidden) closeBoard(); useBox(key); show('s0'); opening(); },
    board: () => openBoard(true)
  };

  // ---- start
  const h = location.hash;
  useBox(/half/i.test(location.pathname + location.search + h) ? 'half' : 'hog');
  if (/board/.test(h)) openBoard(false); else opening();

  // ---- review screenshots only: #demo=N jumps to a screen with sample answers
  // nathan: 1 quiz answered, 2 which half, 3 chips, 4 profile and match, 5 ship preview, 6 end
  // manifest: 1 which half, 2 chips, 3 profile, 4 form filled, 5 done
  const demo = (h.match(/demo=(\d)/) || [])[1];
  if (demo) {
    const n = +demo, o = N ? 1 : 0; field.skip();
    if (N && n >= 1) { show('sq'); q1[1].click(); }
    if (n >= 1 + o) show('s1');
    if (n >= 2 + o) {
      document.querySelector('#s1 .half[data-side="stuff"]').click();
      [['where', 2], ['when', 0], ['size', 1]].forEach(([k, i]) => $$(`#s2 .chips[data-key="${k}"] .chip`)[i].click());
    }
    if (n >= 3 + o) { $('#toCard').click(); if ($('#onBoard')) $('#onBoard').checked = true; }
    if (n >= 4 + o) {
      $('#toShip').click();
      if (!N) {
        [['#fName', 'Dana Ruiz'], ['#fCo', 'Sonoran Sparkling Co.'], ['#fEmail', 'dana@sonoransparkling.com'],
         ['#fStreet', '2150 E Camelback Rd'], ['#fCity', 'Phoenix'], ['#fState', 'AZ'], ['#fZip', '85016']].forEach(([s, v]) => { $(s).value = v; });
        $('#fMatch').checked = true;
        if (n >= 5) $('#ship').requestSubmit();
      }
    }
    if (N && n >= 6) $('#finish').click();
  }
})();
</script>
</body>
</html>
